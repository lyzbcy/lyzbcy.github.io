<!-- AI Coding 比赛看板 — 骨架与样式
     数据: assets/data/aicoding.json(每日由 tools/aicoding/update-aicoding.mjs 更新)
     逻辑: assets/lib-custom/aicoding-board.js(外链,绕开构建链改写;渲染全用 DOM API)
     教训依据: docs/pitfalls/jekyll-build.md 内联 script 会被构建链丢弃 -->

<style>
.aic-hero { text-align: center; padding: 36px 16px 12px; }
.aic-hero h1 {
  font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;
  background: linear-gradient(135deg, #7c3aed, #2563eb, #059669);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 10px;
}
.aic-hero p { font-size: 0.98rem; opacity: 0.65; max-width: 560px; margin: 0 auto; }

.aic-stats {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
  margin: 22px 0 10px;
}
.aic-stat {
  border-radius: 14px; padding: 10px 18px; min-width: 110px; text-align: center;
  border: 1px solid rgba(125, 125, 125, 0.22);
  background: rgba(125, 125, 125, 0.06);
}
.aic-stat b { display: block; font-size: 1.35rem; line-height: 1.2; }
.aic-stat span { font-size: 0.75rem; opacity: 0.6; }

.aic-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px; margin: 18px 0 6px;
}
.aic-sort-group { display: inline-flex; border-radius: 10px; overflow: hidden; border: 1px solid rgba(125,125,125,0.3); }
.aic-sort-btn {
  padding: 6px 14px; font-size: 0.85rem; cursor: pointer; border: none;
  background: transparent; color: inherit; opacity: 0.65;
}
.aic-sort-btn.active { background: rgba(79, 113, 219, 0.18); opacity: 1; font-weight: 600; }
.aic-updated { font-size: 0.78rem; opacity: 0.5; }

.aic-section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 1.12rem; font-weight: 700; margin: 26px 0 4px;
}
.aic-section-title small { font-weight: 400; opacity: 0.55; font-size: 0.8rem; }

.aic-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px; margin: 12px 0;
}
.aic-card {
  display: flex; flex-direction: column; gap: 8px;
  border-radius: 14px; padding: 16px 16px 14px;
  border: 1px solid rgba(125, 125, 125, 0.22);
  background: rgba(125, 125, 125, 0.05);
  transition: border-color .25s, transform .25s;
}
.aic-card:hover { border-color: rgba(79, 113, 219, 0.55); transform: translateY(-2px); }
.aic-card.stale { opacity: 0.62; }
.aic-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.aic-card h3 { font-size: 0.98rem; font-weight: 650; line-height: 1.35; margin: 0; }
.aic-card h3 a { color: inherit; text-decoration: none; }
.aic-card h3 a:hover { text-decoration: underline; }
.aic-type {
  flex-shrink: 0; font-size: 0.68rem; font-weight: 700; white-space: nowrap;
  padding: 3px 9px; border-radius: 999px; border: 1px solid transparent;
}
.aic-type.ai_coding { color: #7c3aed; border-color: rgba(124,58,237,.4); background: rgba(124,58,237,.08); }
.aic-type.pure_coding { color: #0e7490; border-color: rgba(14,116,144,.4); background: rgba(14,116,144,.08); }
.aic-type.dev { color: #92400e; border-color: rgba(146,64,14,.35); background: rgba(146,64,14,.07); }

.aic-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.74rem; }
.aic-chip {
  padding: 2px 9px; border-radius: 999px;
  border: 1px solid rgba(125,125,125,0.25); opacity: 0.85;
}
.aic-chip.prize { color: #b45309; border-color: rgba(180,83,9,.4); background: rgba(180,83,9,.08); font-weight: 650; }
.aic-chip.online { opacity: 0.7; }

.aic-countdown { display: flex; align-items: baseline; gap: 7px; font-size: 0.8rem; }
.aic-days { font-weight: 800; font-size: 1.05rem; }
.aic-days.urgent { color: #dc2626; }
.aic-days.soon { color: #d97706; }
.aic-days.ok { color: #059669; }
.aic-dl-text { opacity: 0.55; font-size: 0.72rem; }

.aic-foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; font-size: 0.72rem; opacity: 0.55; }
.aic-empty {
  text-align: center; padding: 34px 16px; border-radius: 14px;
  border: 1px dashed rgba(125,125,125,0.3); opacity: 0.7; font-size: 0.9rem;
}
.aic-note { font-size: 0.75rem; opacity: 0.45; text-align: center; margin: 26px 0 10px; line-height: 1.7; }
details.aic-more summary { cursor: pointer; font-weight: 650; padding: 6px 0; }
</style>

<div class="aic-hero">
  <h1>🏆 AI Coding 比赛看板</h1>
  <p>全球正在报名的 AI 辅助编程 &amp; 纯 Coding 竞赛,每天早上 9:30 自动更新,按截止时间排序</p>
</div>

<div class="aic-stats" id="aic-stats"></div>

<div class="aic-toolbar">
  <div class="aic-sort-group" role="group" aria-label="排序方式">
    <button class="aic-sort-btn active" data-sort="deadline" type="button">⏳ 按截止</button>
    <button class="aic-sort-btn" data-sort="prize" type="button">💰 按奖金</button>
  </div>
  <div class="aic-updated" id="aic-updated">加载中…</div>
</div>

<div class="aic-section-title">🤖 AI Coding 精选 <small>vibe coding / AI 辅助编程 / 传统编程赛</small></div>
<div class="aic-grid" id="aic-main"></div>

<details class="aic-more" id="aic-more-wrap" style="display:none">
  <summary>🛠️ 更多开发者比赛(点开展开)</summary>
  <div class="aic-grid" id="aic-dev"></div>
</details>

<div class="aic-empty" id="aic-empty" style="display:none">
  主区暂无进行中的 AI Coding 比赛 — 数据每天更新,好比赛正在路上 🚀
</div>

<p class="aic-note">
  数据来源:<a href="https://www.competehub.dev" target="_blank" rel="noopener">AI赛事通 (competehub.dev)</a> 公开列表页,仅作引用聚合,每场比赛附原文链接<br>
  截止时间为抓取日推算的估算值,报名前请以官方页面为准
</p>

<script src="{{ '/assets/lib-custom/aicoding-board.js' | relative_url }}" defer></script>
